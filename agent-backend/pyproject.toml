[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-backend"
version = "1.0.0"
description = "Multi-tenant agent execution service with FastAPI and LangGraph support"
readme = "PHASE2_README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Agent Backend Team" }
]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "pyjwt==2.11.0",
    "python-multipart==0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "httpx==0.25.2",
    "black==23.12.0",
    "flake8==6.1.0",
    "mypy==1.7.0",
]
langgraph = [
    "langgraph>=0.1.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
]
observability = [
    "prometheus-client==0.19.0",
    "python-json-logger==2.0.7",
]
database = [
    "psycopg2-binary==2.9.9",  # PostgreSQL driver
]

[project.urls]
Homepage = "https://github.com/accenture/agent-backend"
Documentation = "https://github.com/accenture/agent-backend#readme"
Repository = "https://github.com/accenture/agent-backend.git"

[tool.setuptools]
packages = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.isort]
profile = "black"
line_length = 100
